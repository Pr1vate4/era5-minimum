name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - run: python -c "import era5_minimum; from era5_minimum.data import era5_loader, inspect_netcdf; print('imports ok')"
      - run: python -m pytest -q
      - run: make download-dry-run
      - run: |
          python scripts/download_era5_range.py --start-date 2024-01-01 --end-date 2024-01-03 --output-root /tmp/era5-range-ci --dry-run
          test ! -e /tmp/era5-range-ci
      - run: make smoke
