seed: 7
output_dir: outputs/latent_probe_smoke

data:
  source: synthetic
  samples: 20
  channels: [t2m, mslp]
  height: 8
  width: 8
  train_samples: 12
  validation_samples: 8

model:
  latent_dim: 4

probe:
  hidden_dim: 16
  batch_size: 4
  learning_rate: 0.05
  max_steps: 40
  parameter_limit: 2000
