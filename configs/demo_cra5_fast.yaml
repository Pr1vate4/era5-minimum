experiment:
  name: cra5_demo_fast
  output_dir: outputs/cra5_demo
  seed: 1337

data:
  subset_size: 8
  channels: 8
  synthetic_shape: [8, 176, 360]

model:
  in_channels: 8
  out_channels: 8
  hidden_dim: 512
  latent_dim: 128
  num_encoder_blocks: 4
  num_decoder_blocks: 4
  num_heads: 8
  patch_size: [4, 4]
  freeze_backbone: false
  use_pretrained: false

optimizer:
  lr: 3e-4
  betas: [0.9, 0.999]
  weight_decay: 0.05

scheduler:
  type: one_cycle
  pct_start: 0.3
  div_factor: 25.0
  final_div_factor: 10000.0

training:
  epochs: 2
  batch_size: 2
  val_frequency: 1
  grad_clip: 1.0
  min_delta: 0.0
  patience: 1000000
  save_best: true

codec:
  test_codec: true
  quantization_step: 0.2
  delta_coding: true
