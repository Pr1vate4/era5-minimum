experiment:
  name: conv_ae_weatherbench2_05_n128
  seed: 42
data:
  dataset_dir: data/weatherbench2_28ch_05_n128
model:
  name: conv_autoencoder
  # 28*8*8 / 56 = exactly 32 tensor elements per latent element.
  latent_channels: 56
training:
  epochs: 20
  max_steps: 2560
  learning_rate: 0.0003
  weight_decay: 0.00001
  grad_clip: 1.0
codec:
  quantization_step: 0.1
