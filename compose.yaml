services:
  api:
    build:
      context: .
      target: runtime-cpu
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: era5-minimum:cpu
    command:
      - python
      - -m
      - uvicorn
      - era5_minimum.api.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --log-level
      - ${LOG_LEVEL:-info}
    environment:
      ERA5_ARTIFACTS_ROOT: ${ERA5_ARTIFACTS_ROOT:-demo/mock}
      ERA5_WEATHER_PROVIDER: ${ERA5_WEATHER_PROVIDER:-zarr}
      ERA5_DATASET_ROOT: ${ERA5_DATASET_ROOT:-/workspace/data/era5_28ch_demo}
      ERA5_DATASET_SPLIT: ${ERA5_DATASET_SPLIT:-validation}
      ERA5_CODEC_MODEL_DIR: ${ERA5_CODEC_MODEL_DIR:-/workspace/artifacts/model-n32}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ${ARTIFACTS_DIR:-./artifacts}:/workspace/artifacts:ro
      - ${DATA_DIR:-./data}:/workspace/data:ro,Z
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_WEATHER_API_TARGET: http://api:8000
      VITE_HOST: 0.0.0.0
      VITE_PORT: "5173"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/workspace:Z
      - frontend_node_modules:/workspace/node_modules
    depends_on:
      api:
        condition: service_healthy

  tools:
    profiles: [tools]
    build:
      context: .
      target: runtime-cpu
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: era5-minimum:cpu
    entrypoint: []
    command: [python, --version]
    volumes:
      - ${DATA_DIR:-./data}:/workspace/data:ro
      - ${OUTPUTS_DIR:-./outputs}:/workspace/outputs
      - ${CHECKPOINTS_DIR:-./checkpoints}:/workspace/checkpoints
      - ${BITSTREAMS_DIR:-./bitstreams}:/workspace/bitstreams
      - ${ARTIFACTS_DIR:-./artifacts}:/workspace/artifacts
      - ${SUBMISSION_DIR:-./submission}:/workspace/submission

  data-tools:
    profiles: [data]
    build:
      context: .
      target: runtime-cpu
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: era5-minimum:cpu
    entrypoint: []
    command: [python, --version]
    volumes:
      - ${DATA_DIR:-./data}:/workspace/data
      - ${OUTPUTS_DIR:-./outputs}:/workspace/outputs
      - ${CHECKPOINTS_DIR:-./checkpoints}:/workspace/checkpoints
      - ${BITSTREAMS_DIR:-./bitstreams}:/workspace/bitstreams
      - ${ARTIFACTS_DIR:-./artifacts}:/workspace/artifacts
      - ${SUBMISSION_DIR:-./submission}:/workspace/submission

volumes:
  frontend_node_modules:
