[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "era5-minimum"
version = "0.1.0"
description = "Sample-efficient ERA5 autoencoder research framework"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "PyYAML>=6.0",
  "torch>=2.2",
  "xarray>=2024.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
